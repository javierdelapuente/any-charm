juju:
  channel: "3/stable"
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

providers:
  microk8s:
    enable: true
    bootstrap: true
    channel: "1.29/stable"
    addons:
      - dns
      - hostpath-storage
      - ingress
      - metallb:10.64.140.43-10.64.140.49

host:
  packages:
    - gnome-keyring
    - python3-pip
    - python3-venv
  snaps:
    charmcraft:
    jq:
    yq:
    rockcraft:
