project: any-charm
path: /home/ubuntu/proj
kill-timeout: 60m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04:
        runner: ["ubuntu-latest"]
    - ubuntu-24.04-arm64:
        runner: ["ubuntu-24.04-arm"]
        arch: arm64
environment:
  SUDO_USER: ubuntu
  LANG: C.UTF-8
  LANGUAGE: en
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge.yaml}")'
exclude:
- .git
- .tox
- .venv
- .*_cache
suites:
  tests/integration/:
    summary: integration tests
    backends:
    - integration-test
    environment:
      MODULE/test_charm: test_charm
      MODULE/test_packages: test_packages
      MODULE/test_charm_k8s: test_charm
      MODULE/test_packages_k8s: test_packages
      CONCIERGE/test_charm_k8s: concierge-microk8s.yaml
      CONCIERGE/test_packages_k8s: concierge-microk8s.yaml
  tests/integration_amd64/:
    summary: integration tests (amd64 only)
    backends:
    - integration-test
    systems:
    - ubuntu-24.04
    environment:
      MODULE/test_demo: test_demo
      CONCIERGE/test_demo: concierge-microk8s.yaml
